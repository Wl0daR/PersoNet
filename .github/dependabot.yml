version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      testing:
        patterns: ["xunit.*", "Shouldly", "NSubstitute", "NetArchTest.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
